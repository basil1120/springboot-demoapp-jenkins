apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: springboot-demoapp-jenkins
  namespace: apps-springboot-demoapp-jenkins
  labels:
    app: springboot-demoapp-jenkins
    app.kubernetes.io/name: springboot-demoapp-jenkins
    app.kubernetes.io/managed-by: modernization-agent
    pipeline: "maturity-V1"
  annotations:
    app.kubernetes.io/maintainer: "(_maintainer)"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: springboot-demoapp-jenkins
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
